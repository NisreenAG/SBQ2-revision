<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio61A SBQ2 Revision Quiz</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2a2e;--mu:#5d6b70;--ac:#0f6e7c;--bd:#d9dedf;--ok:#1b7a3d;--okb:#e4f4ea;--no:#b3261e;--nob:#fbe8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1e2528;--tx:#e8eef0;--mu:#9aa9ae;--ac:#4fb8c8;--bd:#33403f;--ok:#6fd28f;--okb:#1a3326;--no:#ff8a80;--nob:#3a1f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1e2528;--tx:#e8eef0;--mu:#9aa9ae;--ac:#4fb8c8;--bd:#33403f;--ok:#6fd28f;--okb:#1a3326;--no:#ff8a80;--nob:#3a1f1d;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:.2em 0}.sub{color:var(--mu);margin:0 0 18px}
h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin:30px 0 10px;border-bottom:2px solid var(--ac);padding-bottom:4px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.q p{margin:0 0 8px;font-weight:bold}
label{display:block;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;margin:5px 0;cursor:pointer}
label:hover{border-color:var(--ac)}input{margin-right:8px}
label.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
label.ok{background:var(--okb);border-color:var(--ok)}label.no{background:var(--nob);border-color:var(--no)}
.ex{display:none;margin-top:8px;font-size:.93rem;color:var(--mu)}.done .ex{display:block}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd)}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#prog{color:var(--mu);flex:1}
#res{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:16px;margin:14px 0}
#res .big{font-size:2.2rem;font-weight:bold;color:var(--ac)}
#res li{margin:2px 0}
</style></head><body><main>
<h1>Bio61A · SBQ2 Revision Quiz</h1>
<p class="sub">Biological molecules: carbohydrates, lipids, proteins and nucleic acids. 26 multiple-choice questions. Your score is revealed after you submit.</p>
<div id="res"></div>
<div id="qs"></div>
<div class="bar"><span id="prog"></span><button id="sub">Submit</button><button id="rst" class="alt" style="display:none">Try again</button></div>
</main>
<script>
const T=["Carbohydrates","Lipids and membranes","Amino acids and proteins","Nucleic acids and DNA replication"];
const Q=[
[0,"Glucose and fructose are joined to make sucrose. Which outcome is expected?",["A glycosidic bond forms and a water molecule is released","A peptide bond forms and water is released","A glycosidic bond forms as a water molecule is added","The sugars join by hydrogen bonds only"],0,"Joining monomers is a condensation (dehydration) reaction: a covalent glycosidic bond forms and water is released."],
[0,"Lactose is broken into glucose and galactose. Which statement is correct?",["Condensation: water is released","Hydrolysis: water is used to break the glycosidic bond","Hydrolysis: a peptide bond is broken","Condensation: hydrogen bonds are formed"],1,"Breaking a glycosidic bond by adding water is hydrolysis."],
[0,"Cells store glucose as glycogen or starch rather than as many free glucose molecules. Which explanation is best?",["Free glucose cannot be hydrolyzed","Glycogen and starch are lipids that float in the cytoplasm","A large polymer has little effect on the cell's water balance and can be hydrolyzed to release glucose when needed","Glycogen forms when peptide bonds join glucose units"],2,"Many glucose units in one polymer are osmotically far less active than the same number of free molecules, and hydrolysis of glycosidic bonds releases glucose on demand."],
[0,"Why can cellulose chains form strong, rigid fibres?",["Glucose units alternate orientation (β-1,4), giving straight chains that hydrogen-bond side by side","The chains are heavily branched","Cellulose contains peptide bonds","Cellulose is made of fatty acids"],0,"β-1,4 linkages make straight, unbranched chains whose many H-bonds between parallel chains give strength."],
[0,"Compared with starch (α-1,4 helical chains), glycogen is better for rapid glucose release because it…",["has more branches, giving many ends for enzymes to act on","has β-1,4 bonds only","is a protein","is insoluble in every solvent"],0,"Extra branching creates more free ends, so more glucose can be removed at once."],
[1,"Phospholipids in water form a bilayer. Which arrangement is most likely?",["Heads inward, tails facing water","Hydrophilic heads face water, hydrophobic tails face inward","Heads and tails both face water","A single layer with tails exposed"],1,"Polar heads interact with water; nonpolar tails are shielded from it in the interior."],
[1,"Cells grown at a high temperature increase the proportion of saturated fatty acids in their membranes. The likely effect is…",["tails pack more tightly, reducing excess fluidity","tails pack less tightly, increasing fluidity","fatty acids become hydrophilic","the bilayer becomes a triglyceride layer"],0,"Straight saturated tails pack closely, offsetting the extra fluidity caused by heat."],
[1,"Melting points of 18-carbon fatty acids: P (0 cis C=C) 63 °C; Q (2 cis C=C) −8 °C; R (1 cis C=C) 10 °C. Which best keeps a membrane fluid at 4 °C?",["P","Q","R","P and R equally"],1,"Q has the lowest melting point, so it stays fluid (does not solidify) at 4 °C."],
[1,"Why do cis double bonds lower a fatty acid's melting point?",["They add hydrogen bonds between tails","The kinks prevent close packing, so fewer/weaker attractions between tails","They make tails hydrophilic","They lengthen the carbon chain"],1,"Kinked tails cannot pack tightly, so there are fewer London dispersion forces and less energy is needed to melt."],
[1,"How does a phospholipid differ from a triglyceride?",["A phospholipid has a polar phosphate-containing head, making it amphipathic","A phospholipid has three fatty acids","A triglyceride has a phosphate head","Triglycerides form bilayers"],0,"Phospholipids have two fatty acids plus a hydrophilic phosphate head; triglycerides have three tails and no polar head."],
[2,"A diagram shows an amino acid with H₂N– at one end and –COOH at the other. These are the…",["carboxyl at the N-terminus and amino at the C-terminus","amino group and carboxyl group respectively","hydroxyl and phosphate groups","carbonyl and sulfhydryl groups"],1,"H₂N– is the amino group; –COOH is the carboxyl group."],
[2,"Glycine and leucine join to form a dipeptide. Which is correct?",["Condensation; peptide bond; water released","Hydrolysis; peptide bond; water added","Condensation; glycosidic bond; water released","Hydrolysis; ester bond; CO₂ released"],0,"The carboxyl of one amino acid joins the amino group of the next by a peptide bond, releasing water."],
[2,"A tripeptide forms from three amino acids. How many peptide bonds form and how many water molecules are released?",["3 and 3","2 and 2","3 and 2","2 and 3"],1,"n amino acids make n − 1 peptide bonds, releasing n − 1 water molecules."],
[2,"Leucine (nonpolar) in the interior of a soluble protein is mutated to glutamate (charged). Most likely effect?",["No effect, since both are amino acids","A charged side chain in the hydrophobic core interacts poorly with the interior and may disrupt folding","All peptide bonds break","The protein becomes a carbohydrate"],1,"Charged R groups prefer water, so one buried in the core destabilizes the tertiary structure."],
[2,"Which level of protein structure is stabilized by hydrogen bonds between backbone atoms, forming α-helices and β-sheets?",["Primary","Secondary","Tertiary","Quaternary"],1,"Secondary structure arises from backbone H-bonding; primary is the amino acid sequence."],
[2,"A disulfide bridge forms between two cysteine side chains. This contributes mainly to…",["primary structure","tertiary structure","the DNA backbone","membrane fluidity"],1,"Interactions between R groups (including disulfide bridges) stabilize tertiary structure."],
[2,"A large pH change reduces an enzyme's activity. Best explanation?",["pH altered R-group ionization and interactions, changing the enzyme's shape and active site","pH changed the sequence into RNA","pH created more peptide bonds","pH turned the enzyme into a lipid"],0,"Changed ionization disrupts ionic/H-bond interactions, so the 3D shape and active site are altered (denaturation)."],
[2,"Glutamic acid (polar, charged) on a protein's surface is replaced by valine (nonpolar). A reasonable prediction is that…",["surface interactions with water change and the protein may aggregate or misfold","nothing can change","the protein is converted to DNA","all hydrogen bonds in water break"],0,"A nonpolar surface residue interacts poorly with water, which can promote clumping and alter structure."],
[3,"In a DNA nucleotide, the nitrogenous base is attached to which carbon of the sugar, and the phosphate to which?",["Base to 1′, phosphate to 5′","Base to 5′, phosphate to 1′","Base to 3′, phosphate to 2′","Base to 2′, phosphate to 3′"],0,"The base bonds to C1′; the phosphate is attached to C5′. The 3′ carbon carries the −OH."],
[3,"What distinguishes the sugar in DNA (deoxyribose) from that in RNA?",["DNA's sugar lacks an −OH on the 2′ carbon","DNA's sugar has an extra phosphate","DNA's sugar contains nitrogen","DNA's sugar has six carbons"],0,"Deoxyribose has H instead of −OH at C2′; ribose has −OH."],
[3,"A double-stranded DNA sample has 1,000 nucleotides, 18% cytosine. What percentage is adenine?",["18%","32%","36%","64%"],1,"C = G = 18%, so A + T = 64%, and A = T = 32%."],
[3,"Strand 5′–G C T A A C–3′ pairs with its complement. How many hydrogen bonds form in total?",["12","13","15","18"],2,"G–C = 3 bonds, A–T = 2. Pairs: G,C,C = 3 × 3 = 9; T,A,A = 3 × 2 = 6. Total 15."],
[3,"DNA polymerase adds each new nucleotide to which end and group of the growing strand, forming which bond?",["5′ end, phosphate; hydrogen bond","3′ end, −OH; phosphodiester bond","3′ end, phosphate; peptide bond","5′ end, −OH; glycosidic bond"],1,"The 3′ −OH reacts with the incoming nucleotide's 5′ phosphate, forming a phosphodiester bond."],
[3,"Template strand is 5′–G A T T C–3′. Which sequence can DNA polymerase synthesize?",["5′–G A A T C–3′","5′–C T A A G–3′ read as written 3′ to 5′","5′–C T T A G–3′","5′–G A A U C–3′"],0,"The new strand is antiparallel and complementary: template 3′–C T T A G–5′ gives 5′–G A A T C–3′. DNA has no U."],
[3,"Sample X is 60% A–T pairs; sample Y is 60% G–C pairs. Which prediction fits?",["X melts at a lower temperature, as A–T has two hydrogen bonds","Y melts at a lower temperature","Both melt identically","X melts higher, as A–T has three bonds"],0,"More G–C pairs (three H-bonds) means more energy needed to separate strands, so Y is more stable than X."],
[3,"Which feature is consistent with RNA (as opposed to DNA)?",["Contains uracil and ribose and can carry information from DNA to a ribosome","Contains thymine and deoxyribose","Is built from amino acids","Forms a hydrophobic membrane core"],0,"RNA contains ribose and uracil; mRNA carries information from DNA to ribosomes."],
[3,"The phosphodiester bond in a DNA strand links…",["the 3′ −OH of one nucleotide to the 5′ phosphate of the next","two bases across strands","two amino acids","the 2′ carbon to the 1′ carbon"],0,"The sugar–phosphate backbone is formed by phosphodiester bonds between 3′ and 5′ carbons of adjacent nucleotides."]
];
const qs=document.getElementById('qs'),ans={};let done=false,last=-1;
function build(){qs.innerHTML='';done=false;Object.keys(ans).forEach(k=>delete ans[k]);
Q.forEach((q,i)=>{if(q[0]!==last){last=q[0];qs.insertAdjacentHTML('beforeend',`<h2>${T[q[0]]}</h2>`)}
const d=document.createElement('div');d.className='q';d.id='q'+i;
d.innerHTML=`<p>${i+1}. ${q[1]}</p>`+q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${'ABCD'[j]}. ${o}</label>`).join('')+`<div class="ex"></div>`;
d.onchange=e=>{if(done)return;ans[i]=+e.target.value;d.querySelectorAll('label').forEach((l,j)=>l.classList.toggle('sel',j===ans[i]));upd()};qs.appendChild(d)});last=-1;upd()}
function upd(){document.getElementById('prog').textContent=Object.keys(ans).length+' / '+Q.length+' answered'}
document.getElementById('sub').onclick=()=>{if(done)return;const n=Object.keys(ans).length;
if(n<Q.length&&!confirm((Q.length-n)+' question(s) unanswered. Submit anyway?'))return;
done=true;let s=0;const tp=T.map(()=>[0,0]);
Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('done');tp[q[0]][1]++;
const ok=ans[i]===q[3];if(ok){s++;tp[q[0]][0]++}
d.querySelectorAll('input').forEach(x=>x.disabled=true);
d.querySelectorAll('label').forEach((l,j)=>{l.classList.remove('sel');if(j===q[3])l.classList.add('ok');else if(j===ans[i])l.classList.add('no')});
d.querySelector('.ex').innerHTML=(ok?'✓ Correct. ':ans[i]===undefined?'No answer. ':'✗ Incorrect. ')+q[4]});
const r=document.getElementById('res');r.style.display='block';
r.innerHTML=`<div class="big">${s} / ${Q.length}</div><div>${Math.round(s/Q.length*100)}%</div><ul>`+T.map((t,i)=>`<li>${t}: ${tp[i][0]} / ${tp[i][1]}</li>`).join('')+`</ul>Review the explanations below each question.`;
r.scrollIntoView({behavior:'smooth'});document.getElementById('sub').style.display='none';document.getElementById('rst').style.display='inline-block'};
document.getElementById('rst').onclick=()=>{document.getElementById('res').style.display='none';document.getElementById('sub').style.display='inline-block';document.getElementById('rst').style.display='none';build();scrollTo(0,0)};
build();
</script></body></html>
